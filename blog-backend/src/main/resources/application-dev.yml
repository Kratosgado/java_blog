server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: Blog Backend

  data:
    rest:
      base-path: /data
      default-page-size: 10
      max-page-size: 100
      return-body-on-create: true
      return-body-on-update: true
      detection-strategy: annotated # or 'default' to expose all repositories
    hateoas:
      use-hal-as-default-json-media-type: false
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
        one-indexed-parameters: false
        page-parameter: page
        size-parameter: size
      sort:
        sort-parameter: sort
    mongodb:
      host: localhost
      port: 27017
      database: ${MONGO_DB_NAME:blog_nosql}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blog_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: dev-secret-key-change-this-in-production-use-strong-key
  expiration: 86400000

cors:
  allowed-origins: http://localhost:8080,http://localhost:3000,http://localhost:4200,https://studio.apollographql.com

springdoc:
  api-docs:
    path: /docs/api-docs
  swagger-ui:
    path: /docs/swagger-ui.html
    enabled: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
