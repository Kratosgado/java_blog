# Production Profile Configuration

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api
server.error.include-message=never
server.error.include-stacktrace=never

# Database Configuration (PostgreSQL Production - Use environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/blog_db}
spring.datasource.username=${DATABASE_USER:blog_user}
spring.datasource.password=${DATABASE_PASSWORD:blog_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/blog_reviews}

# Logging
logging.level.root=WARN
logging.level.com.kratosgado.blog=INFO
logging.level.org.springframework.web=WARN
logging.file.name=logs/blog-backend.log
logging.file.max-size=10MB
logging.file.max-history=30

# JWT Configuration (Use environment variables in production)
jwt.secret=${JWT_SECRET:change-this-secret-key-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration
cors.allowed-origins=${CORS_ORIGINS:http://localhost:8080}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Info
spring.application.name=Blog Backend API (Production)

# OpenAPI/Swagger Configuration (Disabled in production for security)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# GraphQL Configuration
spring.graphql.graphiql.enabled=false

# Actuator (Limited endpoints in production)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Security Headers
server.compression.enabled=true
server.http2.enabled=true
