server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: never
    include-stacktrace: never
  compression:
    enabled: true
  http2:
    enabled: true

spring:
  application:
    name: Blog Backend API (Production)
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  data:
    mongodb:
      host: ${MONGODB_HOST}
      port: ${MONGODB_PORT}
      database: ${MONGO_DB_NAME}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  graphql:
    graphiql:
      enabled: false

logging:
  level:
    root: WARN
    com.kratosgado.blog: INFO
    org.springframework.web: WARN
  file:
    name: logs/blog-backend.log
    max-size: 10MB
    max-history: 30

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

cors:
  allowed-origins: ${CORS_ORIGINS}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
