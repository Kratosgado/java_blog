# Test Profile Configuration

# Server Configuration
server.port=8081
server.servlet.context-path=/api

# Database Configuration (PostgreSQL Test Database)
spring.datasource.url=jdbc:postgresql://localhost:5432/blog_db_test
spring.datasource.username=blog_user
spring.datasource.password=blog_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=blog_reviews_test

# Logging
logging.level.root=WARN
logging.level.com.kratosgado.blog=INFO
logging.level.org.springframework.web=INFO

# JWT Configuration
jwt.secret=test-secret-key-for-testing-purposes-only
jwt.expiration=3600000

# CORS Configuration
cors.allowed-origins=http://localhost:8081

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Application Info
spring.application.name=Blog Backend API (Test)

# OpenAPI/Swagger Configuration
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# GraphQL Configuration
spring.graphql.graphiql.enabled=false

# Actuator
management.endpoints.web.exposure.include=health
